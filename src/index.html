<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha SOS Brigadista</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<!-- v5: sin DOMPurify, sin Firebase, sanitización manual con escapeHTML -->
<div class="container">
  <h1>🚨 Ficha SOS Brigadista</h1>
  <p class="subtitle">Herramienta de campo — Corrientes, Argentina</p>
  
  <form id="sosForm">
    <label>Nombre completo: <input type="text" id="nombre" required></label>
    <label>DNI: <input type="text" id="dni" required pattern="\d{7,8}"></label>
    <label>Edad: <input type="number" id="edad" required min="18" max="99"></label>
    <label>Teléfono de emergencia: <input type="tel" id="telEmergencia" required></label>
    <label>Condición médica: <input type="text" id="condicionMedica" placeholder="Alergias, medicación, grupo sanguíneo"></label>
    <label>Estado actual:
      <select id="estado" required>
        <option value="">Seleccioná...</option>
        <option value="En base">En base</option>
        <option value="En ruta">En ruta</option>
        <option value="En zona de riesgo">En zona de riesgo</option>
        <option value="EMERGENCIA">🆘 EMERGENCIA</option>
      </select>
    </label>
    <button type="button" id="generarPdf">📄 Generar Ficha PDF</button>
  </form>
  
  <div id="mensaje"></div>
</div>

<script src="script.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => console.log('✅ SW registrado — modo offline listo'));
}
</script>
</body>
</html>
